spring:
  application:
    name: Module4
  datasource:
    url: jdbc:postgresql://localhost:5432/aston_learn_db
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    properties:
      mail:
        smtp:
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory

server:
  port: 8081
  servlet:
    context-path: /module4

kafka:
  bootstrap-servers: localhost:9092